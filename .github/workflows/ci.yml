name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Plugin Check run against the latest action release, so a new
    # check added upstream surfaces even between our own commits.
    - cron: '17 6 * * 1'

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.1 is the plugin's floor (Requires PHP); 8.5 is the newest stable.
        php: ['8.1', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install core dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install plugin dependencies
        run: composer install --prefer-dist --no-progress --working-dir=plugin

      - name: Lint, static analysis, and test suites
        run: composer check

  plugin-check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    name: Plugin Check
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Install core dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install plugin dependencies
        run: composer install --prefer-dist --no-progress --working-dir=plugin

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1.1.9
        with:
          build-dir: './plugin'

  plugin-check-latest:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    name: Plugin Check (latest, weekly)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Install core dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install plugin dependencies
        run: composer install --prefer-dist --no-progress --working-dir=plugin

      - name: Run Plugin Check (latest release)
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './plugin'
