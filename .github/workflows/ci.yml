name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install core dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install plugin dependencies
        run: composer install --prefer-dist --no-progress --working-dir=plugin

      - name: Lint, static analysis, and test suites
        run: composer check
