name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Plugin Check run against the latest action release, so a new
    # check added upstream surfaces even between our own commits.
    - cron: '17 6 * * 1'
  workflow_call:
    inputs:
      zip-artifact:
        description: >
          Name of a zip artifact already uploaded earlier in this workflow
          run (by release.yml's build job). When set, the Plugin Check job
          downloads and checks THAT zip instead of building its own, so the
          release gate builds the shipped zip exactly once and reuses it for
          both Plugin Check and the GitHub Release. Left empty for the
          ordinary push/PR/schedule triggers, where there is no sibling
          build job to reuse and Plugin Check builds its own zip.
        required: false
        type: string
        default: ''

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.1 is the plugin's floor (Requires PHP); 8.5 is the newest stable.
        php: ['8.1', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install core dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install plugin dependencies
        run: composer install --prefer-dist --no-progress --working-dir=plugin

      - name: Lint, static analysis, and test suites
        run: composer check

  plugin-check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    name: Plugin Check
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      # Plugin Check must run against the BUILT zip (spec §3.6.8, §3.7.5),
      # never against ./plugin directly: the zip is the allowlisted subset
      # that actually ships, and that's what a reviewer (and wordpress.org's
      # own automation) sees.
      - name: Download the release build's zip
        if: inputs.zip-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.zip-artifact }}
          path: build-artifact

      - name: Build the zip (bin/build-zip.sh, the single allowlisted build)
        if: inputs.zip-artifact == ''
        run: bin/build-zip.sh

      - name: Locate and extract the zip
        id: zip
        run: |
          if [ -n "${{ inputs.zip-artifact }}" ]; then
            ZIP_PATH=$(find build-artifact -maxdepth 1 -name '*.zip' | head -1)
          else
            ZIP_PATH=$(find . -maxdepth 1 -name 'agent-safety-*.zip' | head -1)
          fi
          echo "path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          mkdir -p extracted
          unzip -q "$ZIP_PATH" -d extracted

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1.1.9
        with:
          build-dir: './extracted/agent-safety'

  plugin-check-latest:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    name: Plugin Check (latest, weekly)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Build the zip (bin/build-zip.sh, the single allowlisted build)
        run: bin/build-zip.sh

      - name: Extract the zip
        run: |
          ZIP_PATH=$(find . -maxdepth 1 -name 'agent-safety-*.zip' | head -1)
          mkdir -p extracted
          unzip -q "$ZIP_PATH" -d extracted

      - name: Run Plugin Check (latest release)
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './extracted/agent-safety'
