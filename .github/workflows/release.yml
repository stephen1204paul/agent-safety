name: Release

# D30/spec §3.7.6, §3.12: a tag push v* — or a manual dispatch with a
# dry_run input — runs the full release gate (CI suites + Plugin Check +
# E2E) against a zip built once by bin/build-zip.sh, the single allowlisted
# build. The GitHub Release is created only on a real tag push, never on a
# workflow_dispatch (dry_run or not): that's how stage 13 proves a planted
# failure blocks the release, and that an unplanted run is green, without a
# scratch tag.
#
# Plugin Check runs inside ci.yml (called below via workflow_call) against
# THIS SAME zip artifact, not a second build: ci.yml's plugin-check job
# accepts an optional zip-artifact input and downloads it instead of
# building its own when the input is set. That keeps one Plugin Check job
# definition serving both standalone CI runs (which build their own zip)
# and this gate (which reuses the release build), and guarantees the zip
# Plugin Check inspects is byte-identical to the one that ships.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the full gate but never create a GitHub Release'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build zip
    outputs:
      zip-name: ${{ steps.zip.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Assert tag matches plugin header Version
        # Only meaningful for a real tag push: a workflow_dispatch run has
        # no tag to compare against (github.ref is whatever ref the owner
        # dispatched on, not a version), so the assertion is skipped there.
        # A dispatch's job is to prove the OTHER gates (suites, Plugin
        # Check, e2e) on a planted failure; the tag/header match is
        # re-proven for real at the stage-17 tag push, which is the only
        # event that can reach the release job below anyway.
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          HEADER_VERSION=$(awk '/^[[:space:]]*\*[[:space:]]*Version:/ {print $NF; exit}' plugin/agent-safety.php)
          echo "tag=$TAG_VERSION header=$HEADER_VERSION"
          if [ "$TAG_VERSION" != "$HEADER_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match plugin header Version $HEADER_VERSION — bump the header and re-tag."
            exit 1
          fi

      - name: Build the zip (bin/build-zip.sh, the single allowlisted build)
        run: bin/build-zip.sh

      - name: Locate the zip
        id: zip
        run: |
          ZIP_PATH=$(ls agent-safety-*.zip | head -1)
          echo "path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ZIP_PATH" .zip)" >> "$GITHUB_OUTPUT"

      - name: Upload the zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error

  ci:
    needs: build
    uses: ./.github/workflows/ci.yml
    with:
      zip-artifact: ${{ needs.build.outputs.zip-name }}

  e2e:
    needs: build
    uses: ./.github/workflows/e2e.yml

  release:
    needs: [build, ci, e2e]
    # Belt-and-braces: this alone (event_name, not the dry_run input) is
    # what keeps a workflow_dispatch from ever creating a Release, whatever
    # dry_run is set to — only a tag push reaches this job's condition.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Create GitHub Release
    steps:
      - name: Download the built zip
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.zip-name }}

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          generate_release_notes: true
