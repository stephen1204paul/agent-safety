name: E2E

# Live wp-env smoke of the governed core/ namespace (spec-0.3 D29): drives
# mcp-adapter's HTTP transport end to end and asserts the audit trail, the
# fail-closed unknown-verb denial, and read-path PII redaction. Woo-off legs
# are mandatory; Woo-on legs prove the core module coexists with the Woo
# integration (presets merge, namespaces unique).
#
# Blocking legs (spec §3.7.7): the exact current WordPress release (checked
# against https://api.wordpress.org/core/version-check/1.7/ on 2026-09-25:
# 7.1.2) x {Woo on, off}, plus the Woo 11.1 native-MCP leg below. Trunk legs
# run with continue-on-error so a moving target never blocks the gate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: {}

jobs:
  core-smoke:
    runs-on: ubuntu-latest
    name: Core smoke (${{ matrix.trunk && 'trunk' || 'latest' }}, Woo ${{ matrix.woo && 'on' || 'off' }})
    continue-on-error: ${{ matrix.trunk }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Blocking: the exact current WordPress release, per spec §3.7.7.
          - core: '7.1.2'
            woo: true
            trunk: false
          - core: '7.1.2'
            woo: false
            trunk: false
          # Non-blocking: trunk is a moving target.
          - core: 'WordPress/WordPress#master'
            woo: true
            trunk: true
          - core: 'WordPress/WordPress#master'
            woo: false
            trunk: true
    env:
      # Pinned upstream mcp-adapter (0.6.0). Bump deliberately: the smoke
      # drives its public HTTP transport + default-server config filter.
      MCP_ADAPTER_REF: 07c9912
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Clone pinned mcp-adapter and install its runtime deps
        run: |
          git clone --quiet https://github.com/WordPress/mcp-adapter.git ../mcp-adapter
          git -C ../mcp-adapter checkout --quiet "$MCP_ADAPTER_REF"
          composer install --working-dir=../mcp-adapter --no-dev --prefer-dist

      - name: Generate .wp-env.json (matrix core)
        run: |
          # shellcheck disable=SC2016 # the JS is single-quoted on purpose; "$schema" is a JSON key
          node -e '
            const fs = require("fs");
            const config = {
              "$schema": "https://schemas.wp.org/trunk/wp-env.json",
              core: process.env.WPENV_CORE,
              phpVersion: "8.3",
              mappings: {
                "wp-content/plugins/agent-safety": "./plugin",
                "wp-content/plugins/mcp-adapter": "../mcp-adapter",
                "wp-content/mu-plugins/agsafe-smoke-fixture.php": "./dev/smoke/agsafe-smoke-fixture.php"
              },
              config: { WP_DEBUG: true, WP_DEBUG_LOG: true }
            };
            fs.writeFileSync(".wp-env.json", JSON.stringify(config, null, 4));
          '
        env:
          WPENV_CORE: ${{ matrix.core }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the plugin's runtime deps (core lib copy)
        working-directory: plugin
        run: composer install --no-dev --prefer-dist --optimize-autoloader --quiet

      - name: Start wp-env
        run: |
          npm install --no-save @wordpress/env
          npx wp-env start

      - name: Activate plugins
        run: npx wp-env run cli wp plugin activate agent-safety mcp-adapter

      - name: Install WooCommerce (Woo-on legs only)
        if: ${{ matrix.woo }}
        run: npx wp-env run cli wp plugin install woocommerce --activate

      - name: Create and bind the smoke credential
        run: |
          PW=$(npx wp-env run cli wp user application-password create admin e2e-smoke --porcelain | tail -1)
          UUID=$(npx wp-env run cli wp user application-password list admin --format=csv --fields=uuid,name | awk -F, 'tolower($2) == "e2e-smoke" {print $1}' | tr -d '\r')
          npx wp-env run cli wp option update agsafe_pack_bindings "{\"app:$UUID\":\"site-readonly\"}" --format=json
          echo "AGSAFE_SMOKE_APP_PASSWORD=$PW" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/smoke/package.json

      - name: Install Playwright
        working-directory: dev/smoke
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Run the core-module smoke
        working-directory: dev/smoke
        run: node smoke-core.js

      - name: Upload smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots-core-${{ matrix.trunk && 'trunk' || 'latest' }}-woo-${{ matrix.woo }}
          path: dev/smoke/shots/
          if-no-files-found: ignore

  woo-native-mcp:
    runs-on: ubuntu-latest
    name: Woo 11.1 native-MCP e2e
    # Blocking (spec §3.2.5, §3.7.7): WooCommerce 11.1.0 is pinned by the
    # leg's own .wp-env.json (exact downloads.wordpress.org zip), so there is
    # no "trunk" variant of this leg to soften. Runs Woo's OWN bundled
    # mcp-adapter v0.3.0 — no standalone mcp-adapter checkout needed here.
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install the plugin's runtime deps (core lib copy)
        working-directory: plugin
        run: composer install --no-dev --prefer-dist --optimize-autoloader --quiet

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/smoke/woo-native-mcp/package.json

      - name: Install wp-env + the leg's own deps
        working-directory: dev/smoke/woo-native-mcp
        run: npm install

      - name: Provision the Woo-native-MCP environment
        working-directory: dev/smoke/woo-native-mcp
        run: ./setup.sh

      - name: Run the Woo-native-MCP smoke (cases + control)
        working-directory: dev/smoke/woo-native-mcp
        run: node run.js

      - name: Stop wp-env
        if: always()
        working-directory: dev/smoke/woo-native-mcp
        run: npx @wordpress/env stop
